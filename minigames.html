<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hub de Minigames | Ivan Lopes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Space+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .game-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            margin-top: 40px;
        }

        #gameCanvas {
            background-color: #0A0A0C;
            border: 1px solid var(--accent-red);
            box-shadow: 0 0 20px rgba(168, 18, 18, 0.2);
        }

        .game-stats {
            display: flex;
            gap: 40px;
            font-family: var(--font-mono);
            font-size: 1rem;
        }

        .game-controls {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="noise-overlay"></div>

    <header>
        <div class="brand-id">IVAN LOPES<span>_01</span></div>
        <nav>
            <a href="index.html">← VOLTAR AO PORTFÓLIO</a>
        </nav>
    </header>

    <main>
        <section class="hero-editorial">
            <h1 class="hero-title">
                MINIGAME <span class="red-accent">HUB</span>
            </h1>
            <p class="bio-text">
                Protótipo 01: Manipulação do DOM e lógica de Game Loop em JavaScript puro com Canvas HTML5.
            </p>

            <div class="game-container">
                <div class="game-stats">
                    <div>PONTOS: <span id="score" class="red-accent">0</span></div>
                    <div>RECORDES: <span id="highScore">0</span></div>
                </div>

                <canvas id="gameCanvas" width="400" height="400"></canvas>

                <div class="game-controls">
                    <p>USAS AS SETAS DO TECLADO PARA MOVER</p>
                    <button id="startBtn" class="p-action" style="margin-top: 15px; cursor: pointer;">INICIAR / REINICIAR</button>
                </div>
            </div>
        </section>
    </main>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highScoreElement = document.getElementById('highScore');
        const startBtn = document.getElementById('startBtn');

        const gridSize = 20;
        const tileCount = canvas.width / gridSize;

        let snake = [{ x: 10, y: 10 }];
        let food = { x: 15, y: 15 };
        let dx = 0;
        let dy = 0;
        let score = 0;
        let highScore = 0;
        let gameInterval = null;
        let isRunning = false;

        function drawGame() {
            moveSnake();
            if (checkGameOver()) return;

            clearCanvas();
            drawFood();
            drawSnake();
        }

        function clearCanvas() {
            ctx.fillStyle = '#060607';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        function drawSnake() {
            ctx.fillStyle = '#A81212';
            snake.forEach((part, index) => {
                if (index === 0) ctx.fillStyle = '#E61C1C';
                else ctx.fillStyle = '#A81212';
                ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
            });
        }

        function drawFood() {
            ctx.fillStyle = '#10B981';
            ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);
        }

        function moveSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                score += 10;
                scoreElement.textContent = score;
                if (score > highScore) {
                    highScore = score;
                    highScoreElement.textContent = highScore;
                }
                generateFood();
            } else {
                snake.pop();
            }
        }

        function generateFood() {
            food.x = Math.floor(Math.random() * tileCount);
            food.y = Math.floor(Math.random() * tileCount);
        }

        function checkGameOver() {
            const head = snake[0];

            if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) {
                resetGame();
                return true;
            }

            for (let i = 1; i < snake.length; i++) {
                if (head.x === snake[i].x && head.y === snake[i].y) {
                    resetGame();
                    return true;
                }
            }
            return false;
        }

        function resetGame() {
            alert(`Game Over! Pontuação final: ${score}`);
            clearInterval(gameInterval);
            isRunning = false;
            snake = [{ x: 10, y: 10 }];
            dx = 0;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
        }

        function startGame() {
            if (isRunning) clearInterval(gameInterval);
            snake = [{ x: 10, y: 10 }];
            dx = 1;
            dy = 0;
            score = 0;
            scoreElement.textContent = score;
            isRunning = true;
            generateFood();
            gameInterval = setInterval(drawGame, 100);
        }

        window.addEventListener('keydown', e => {
            if (!isRunning) return;
            switch (e.key) {
                case 'ArrowUp':
                    if (dy !== 1) { dx = 0; dy = -1; }
                    break;
                case 'ArrowDown':
                    if (dy !== -1) { dx = 0; dy = 1; }
                    break;
                case 'ArrowLeft':
                    if (dx !== 1) { dx = -1; dy = 0; }
                    break;
                case 'ArrowRight':
                    if (dx !== -1) { dx = 1; dy = 0; }
                    break;
            }
        });

        startBtn.addEventListener('click', startGame);
    </script>
</body>
</html>
