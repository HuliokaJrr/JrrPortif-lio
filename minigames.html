<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arcade Hub | Ivan Lopes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .arcade-layout {
            display: grid;
            grid-template-columns: 260px 1fr;
            gap: 30px;
            margin-top: 40px;
            align-items: start;
        }

        .game-selector {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .game-btn {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            text-align: left;
            padding: 16px 20px;
            background: var(--surface-color);
            border: 1px solid var(--line-color);
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.3s;
            border-radius: 4px;
        }

        .game-btn:hover, .game-btn.active {
            border-color: var(--accent-violet);
            color: #FFF;
            background: var(--surface-hover);
            box-shadow: 0 0 15px rgba(139, 40, 202, 0.2);
        }

        .terminal-box {
            width: 100%;
            background: #000;
            border: 1px solid var(--accent-violet);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(139, 40, 202, 0.2);
        }

        .terminal-header {
            background: #140b20;
            padding: 12px 20px;
            border-bottom: 1px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #07060c;
        }

        #gameCanvas {
            background-color: #020205;
            border: 1px solid var(--line-color);
        }

        .terminal-controls {
            padding: 20px;
            background: #0b0b14;
            border-top: 1px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .score-display {
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .score-display span {
            color: var(--accent-cyan);
            font-weight: bold;
        }

        .btn-arcade {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: #FFF;
            background: var(--accent-purple);
            border: 1px solid var(--accent-violet);
            padding: 10px 22px;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.3s;
        }

        .btn-arcade:hover {
            background: var(--accent-violet);
            box-shadow: 0 0 15px rgba(139, 40, 202, 0.5);
        }

        @media (max-width: 850px) {
            .arcade-layout { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <header>
        <div class="brand-id">IVAN LOPES<span>_01</span></div>
        <nav>
            <a href="index.html">← VOLTAR AO PORTFÓLIO</a>
        </nav>
    </header>

    <main>
        <section class="hero-editorial">
            <h1 class="hero-title">
                ARCADE <span class="purple-accent">HUB</span>
            </h1>
            <p class="bio-text">
                Escolha o jogo no menu lateral e teste as engines interativas desenvolvidas em JavaScript puro.
            </p>

            <div class="arcade-layout">
                <!-- MENU INTERATIVO DE JOGOS -->
                <div class="game-selector">
                    <button class="game-btn active" onclick="switchGame('invaders', this)">01. SPACE INVADERS</button>
                    <button class="game-btn" onclick="switchGame('flappy', this)">02. FLAPPY BIRD</button>
                    <button class="game-btn" onclick="switchGame('pong', this)">03. RETRO PONG</button>
                    <button class="game-btn" onclick="switchGame('snake', this)">04. SNAKE MODERN</button>
                </div>

                <!-- TERMINAL ONDE O JOGO RODA -->
                <div class="terminal-box">
                    <div class="terminal-header">
                        <div id="gameTitle" style="color: var(--accent-cyan);">MODO: SPACE_INVADERS</div>
                        <div>STATUS: <span id="sysStatus" style="color: var(--accent-violet);">STANDBY</span></div>
                    </div>

                    <div class="canvas-container">
                        <canvas id="gameCanvas" width="400" height="400"></canvas>
                    </div>

                    <div class="terminal-controls">
                        <div class="score-display">
                            PONTOS: <span id="score">00</span>
                        </div>
                        <button id="startBtn" class="btn-arcade">> INICIAR JOGO</button>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // --- CHUVA DIGITAL DE FUNDO ---
        const bgCanvas = document.getElementById('bgCanvas');
        const bgCtx = bgCanvas.getContext('2d');
        bgCanvas.width = window.innerWidth;
        bgCanvas.height = window.innerHeight;
        const chars = '0189ABCDEF';
        const drops = Array(Math.floor(bgCanvas.width / 14)).fill(1);
        setInterval(() => {
            bgCtx.fillStyle = 'rgba(11, 11, 20, 0.15)';
            bgCtx.fillRect(0, 0, bgCanvas.width, bgCanvas.height);
            bgCtx.fillStyle = '#480666';
            bgCtx.font = '14px "Space Mono"';
            drops.forEach((y, i) => {
                bgCtx.fillText(chars[Math.floor(Math.random()*chars.length)], i * 14, y * 14);
                if (y * 14 > bgCanvas.height && Math.random() > 0.975) drops[i] = 0;
                drops[i]++;
            });
        }, 40);

        // --- SISTEMA DE ENGINE DE JOGOS ---
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const startBtn = document.getElementById('startBtn');
        const sysStatus = document.getElementById('sysStatus');
        const gameTitle = document.getElementById('gameTitle');

        let currentGame = 'invaders';
        let gameLoop = null;
        let score = 0;
        let active = false;

        function switchGame(game, btn) {
            stopGame();
            currentGame = game;
            document.querySelectorAll('.game-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            const titles = {
                'invaders': 'MODO: SPACE_INVADERS',
                'flappy': 'MODO: FLAPPY_BIRD',
                'pong': 'MODO: RETRO_PONG',
                'snake': 'MODO: SNAKE_MODERN'
            };
            gameTitle.textContent = titles[game];
            resetScreen();
        }

        function resetScreen() {
            active = false;
            sysStatus.textContent = "STANDBY";
            score = 0;
            scoreEl.textContent = "00";
            ctx.fillStyle = '#020205';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#8e9bb0';
            ctx.font = '14px "Space Mono"';
            ctx.textAlign = 'center';
            ctx.fillText("CLIQUE EM '> INICIAR JOGO'", canvas.width / 2, canvas.height / 2);
        }

        function stopGame() {
            if (gameLoop) clearInterval(gameLoop);
            active = false;
        }

        function startGame() {
            stopGame();
            active = true;
            sysStatus.textContent = "ONLINE";
            score = 0;
            scoreEl.textContent = "00";

            if (currentGame === 'invaders') setupInvaders();
            if (currentGame === 'flappy') setupFlappy();
            if (currentGame === 'pong') setupPong();
            if (currentGame === 'snake') setupSnake();
        }

        function gameOver(msg = "GAME OVER") {
            stopGame();
            sysStatus.textContent = "OFFLINE";
            ctx.fillStyle = 'rgba(7, 6, 12, 0.85)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#8b28ca';
            ctx.font = 'bold 16px "Space Mono"';
            ctx.textAlign = 'center';
            ctx.fillText(msg, canvas.width / 2, canvas.height / 2);
        }

        // --- 1. SPACE INVADERS ---
        let playerX, bullets, aliens;
        function setupInvaders() {
            playerX = 180; bullets = []; aliens = [];
            for (let r = 0; r < 3; r++) {
                for (let c = 0; c < 6; c++) {
                    aliens.push({ x: c * 50 + 50, y: r * 30 + 40, alive: true });
                }
            }
            gameLoop = setInterval(runInvaders, 30);
        }
        function runInvaders() {
            ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#38bdf8'; ctx.fillRect(playerX, 360, 40, 10);

            bullets.forEach((b, i) => {
                b.y -= 7;
                ctx.fillStyle = '#8b28ca'; ctx.fillRect(b.x, b.y, 4, 10);
                if (b.y < 0) bullets.splice(i, 1);
            });

            aliens.forEach(a => {
                if (!a.alive) return;
                ctx.fillStyle = '#273966'; ctx.fillRect(a.x, a.y, 30, 18);
                bullets.forEach((b, bi) => {
                    if (b.x > a.x && b.x < a.x + 30 && b.y > a.y && b.y < a.y + 18) {
                        a.alive = false; bullets.splice(bi, 1);
                        score += 20; scoreEl.textContent = score;
                    }
                });
            });
            if (aliens.every(a => !a.alive)) gameOver("MISSÃO CUMPRIDA!");
        }

        // --- 2. FLAPPY BIRD ---
        let birdY, birdV, pipes;
        function setupFlappy() {
            birdY = 200; birdV = 0; pipes = [{ x: 400, top: 120, bottom: 120 }];
            gameLoop = setInterval(runFlappy, 30);
        }
        function runFlappy() {
            birdV += 0.55; birdY += birdV;
            if (birdY > canvas.height || birdY < 0) return gameOver();

            ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#8b28ca'; ctx.fillRect(80, birdY, 16, 16);

            ctx.fillStyle = '#191766';
            pipes.forEach(p => {
                p.x -= 3;
                ctx.fillRect(p.x, 0, 40, p.top);
                ctx.fillRect(p.x, canvas.height - p.bottom, 40, p.bottom);
                if (p.x < -40) {
                    p.x = 400; p.top = Math.random() * 140 + 40; p.bottom = Math.random() * 140 + 40;
                    score += 10; scoreEl.textContent = score;
                }
                if (80 + 16 > p.x && 80 < p.x + 40 && (birdY < p.top || birdY + 16 > canvas.height - p.bottom)) gameOver();
            });
        }

        // --- 3. RETRO PONG ---
        let bx, by, bsx, bsy, py, aipy;
        function setupPong() {
            bx = 200; by = 200; bsx = 4; bsy = 3; py = 160; aipy = 160;
            gameLoop = setInterval(runPong, 30);
        }
        function runPong() {
            bx += bsx; by += bsy;
            if (by < 0 || by > canvas.height) bsy *= -1;
            if (aipy + 35 < by) aipy += 2.5; else aipy -= 2.5;
            if (bx < 25 && by > py && by < py + 70) { bsx *= -1; score += 5; scoreEl.textContent = score; }
            if (bx > canvas.width - 25 && by > aipy && by < aipy + 70) bsx *= -1;
            if (bx < 0 || bx > canvas.width) return gameOver();

            ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#38bdf8'; ctx.fillRect(15, py, 10, 70);
            ctx.fillStyle = '#8b28ca'; ctx.fillRect(canvas.width - 25, aipy, 10, 70);
            ctx.fillRect(bx, by, 8, 8);
        }

        // --- 4. SNAKE MODERN ---
        let snake, food, dx, dy, grid = 20;
        function setupSnake() {
            snake = [{ x: 200, y: 200 }]; food = { x: 100, y: 100 }; dx = grid; dy = 0;
            gameLoop = setInterval(runSnake, 90);
        }
        function runSnake() {
            const head = { x: snake[0].x + dx, y: snake[0].y + dy };
            if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || snake.some(s => s.x === head.x && s.y === head.y)) return gameOver();
            snake.unshift(head);
            if (head.x === food.x && head.y === food.y) {
                score += 10; scoreEl.textContent = score;
                food = { x: Math.floor(Math.random() * (canvas.width / grid)) * grid, y: Math.floor(Math.random() * (canvas.height / grid)) * grid };
            } else snake.pop();

            ctx.fillStyle = '#020205'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#38bdf8'; ctx.fillRect(food.x, food.y, grid - 2, grid - 2);
            snake.forEach((s, i) => {
                ctx.fillStyle = i === 0 ? '#8b28ca' : '#273966';
                ctx.fillRect(s.x, s.y, grid - 2, grid - 2);
            });
        }

        // CONTROLES DE TECLADO
        document.addEventListener('keydown', e => {
            if (!active) return;
            if (currentGame === 'invaders') {
                if (e.key === 'ArrowLeft' && playerX > 10) playerX -= 20;
                if (e.key === 'ArrowRight' && playerX < canvas.width - 50) playerX += 20;
                if (e.key === ' ' || e.key === 'ArrowUp') bullets.push({ x: playerX + 18, y: 360 });
            }
            if (currentGame === 'flappy' && (e.key === ' ' || e.key === 'ArrowUp')) birdV = -7.5;
            if (currentGame === 'pong') {
                if (e.key === 'ArrowUp' && py > 10) py -= 25;
                if (e.key === 'ArrowDown' && py < canvas.height - 80) py += 25;
            }
            if (currentGame === 'snake') {
                if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -grid; }
                if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = grid; }
                if (e.key === 'ArrowLeft' && dx === 0) { dx = -grid; dy = 0; }
                if (e.key === 'ArrowRight' && dx === 0) { dx = grid; dy = 0; }
            }
        });

        startBtn.addEventListener('click', startGame);
        resetScreen();
    </script>
</body>
</html>
