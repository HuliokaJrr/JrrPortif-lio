<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minigame Hub | Ivan Lopes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .arcade-wrapper {
            margin-top: 40px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        .terminal-box {
            width: 100%;
            max-width: 600px;
            background: #000000;
            border: 1px solid var(--accent-red);
            border-radius: 4px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 30px rgba(168, 18, 18, 0.15);
        }

        /* Efeito Scanline CRT */
        .terminal-box::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 10;
            pointer-events: none;
        }

        .terminal-header {
            background: #100a0b;
            padding: 12px 20px;
            border-bottom: 1px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .terminal-header span {
            color: var(--accent-red);
        }

        .canvas-container {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: #060607;
        }

        #gameCanvas {
            background-color: #020203;
            border: 1px solid var(--line-color);
        }

        .terminal-controls {
            padding: 20px;
            background: #0A0A0C;
            border-top: 1px solid var(--line-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .score-display {
            font-family: var(--font-mono);
            font-size: 0.9rem;
        }

        .score-display span {
            color: var(--accent-red);
            font-weight: bold;
        }

        .btn-arcade {
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-color);
            background: transparent;
            border: 1px solid var(--accent-red);
            padding: 10px 20px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-arcade:hover {
            background: var(--accent-red);
            color: #FFF;
            box-shadow: 0 0 15px rgba(168, 18, 18, 0.4);
        }

        .instructions {
            font-family: var(--font-mono);
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 20px;
            text-align: center;
        }
    </style>
</head>
<body>

    <header>
        <div class="brand-id">IVAN LOPES<span>_01</span></div>
        <nav>
            <a href="index.html">← VOLTAR AO PORTFÓLIO</a>
        </nav>
    </header>

    <main>
        <section class="hero-editorial">
            <h1 class="hero-title">
                MINIGAME <span class="red-accent">HUB</span>
            </h1>

            </p>

            <div class="arcade-wrapper">
                <div class="terminal-box">
                    <div class="terminal-header">
                        <div>SYS_STATUS: <span>ONLINE</span></div>

                    </div>

                    <div class="canvas-container">
                        <canvas id="gameCanvas" width="400" height="400"></canvas>

                    <div class="terminal-controls">
                        <div class="score-display">
                            PONTOS: <span id="score">00</span> | RECORD: <span id="highScore">00</span>
                        </div>
                        <button id="startBtn" class="btn-arcade">> INICIAR SEQUÊNCIA</button>

                </div>

                <p class="instructions">[ USE AS SETAS DO TECLADO PARA NAVEGAR ]</p>
            </div>
        </section>
    </main>
